<svg width="400" height="300"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="bg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#f0ead6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#d4c4a8;stop-opacity:1" />
        </radialGradient>
    </defs>

    <!-- Фон -->
    <rect width="400" height="300" fill="url(#bg)"/>

    <!-- Центральна площа -->
    <circle cx="200" cy="150" r="80" fill="#e6d7c3"/>

    <!-- Пам'ятник в центрі -->
    <rect x="190" y="120" width="20" height="60" fill="#8b7355"/>
    <rect x="185" y="110" width="30" height="20" fill="#8b7355"/>

    <!-- Дерева навколо -->
    <circle cx="120" cy="100" r="15" fill="#6b5b47"/>
    <circle cx="280" cy="100" r="15" fill="#6b5b47"/>
    <circle cx="120" cy="200" r="15" fill="#6b5b47"/>
    <circle cx="280" cy="200" r="15" fill="#6b5b47"/>

    <!-- Текст -->
    <text x="200" y="250" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#8b7355">Площа Героїв Майдану</text>
</svg>
