<svg width="120" height="120"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="fortressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8b7355;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6b5b47;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="wallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#c9b896;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b8a082;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Основа фортеці -->
    <rect x="10" y="70" width="100" height="40" fill="url(#wallGradient)" rx="3"/>

    <!-- Центральна вежа -->
    <rect x="50" y="40" width="20" height="70" fill="url(#fortressGradient)" rx="2"/>

    <!-- Бічні вежі -->
    <rect x="20" y="50" width="15" height="60" fill="url(#fortressGradient)" rx="2"/>
    <rect x="85" y="50" width="15" height="60" fill="url(#fortressGradient)" rx="2"/>

    <!-- Дахи веж -->
    <polygon points="45,40 60,25 75,40" fill="#d4c4a8"/>
    <polygon points="15,50 27,35 40,50" fill="#d4c4a8"/>
    <polygon points="80,50 92,35 105,50" fill="#d4c4a8"/>

    <!-- Шпилі веж -->
    <rect x="58" y="20" width="4" height="10" fill="#8b7355"/>
    <circle cx="60" cy="18" r="2" fill="#d4c4a8"/>

    <rect x="26" y="30" width="3" height="8" fill="#8b7355"/>
    <circle cx="27" cy="28" r="1.5" fill="#d4c4a8"/>

    <rect x="91" y="30" width="3" height="8" fill="#8b7355"/>
    <circle cx="92" cy="28" r="1.5" fill="#d4c4a8"/>

    <!-- Бійниці -->
    <rect x="25" y="60" width="5" height="8" fill="#6b5b47"/>
    <rect x="35" y="60" width="5" height="8" fill="#6b5b47"/>
    <rect x="55" y="55" width="5" height="8" fill="#6b5b47"/>
    <rect x="65" y="55" width="5" height="8" fill="#6b5b47"/>
    <rect x="90" y="60" width="5" height="8" fill="#6b5b47"/>
    <rect x="100" y="60" width="5" height="8" fill="#6b5b47"/>

    <!-- Ворота -->
    <rect x="55" y="80" width="10" height="30" fill="#6b5b47"/>
    <polygon points="55,80 60,75 65,80" fill="#8b7355"/>

    <!-- Міст -->
    <rect x="50" y="105" width="20" height="5" fill="#8b7355"/>
    <rect x="45" y="108" width="30" height="3" fill="#6b5b47"/>

    <!-- Прапори -->
    <line x1="60" y1="18" x2="60" y2="12" stroke="#8b7355" stroke-width="1"/>
    <polygon points="60,12 65,10 60,8" fill="#d4c4a8"/>

    <line x1="27" y1="28" x2="27" y2="22" stroke="#8b7355" stroke-width="1"/>
    <polygon points="27,22 30,20 27,18" fill="#d4c4a8"/>

    <line x1="92" y1="28" x2="92" y2="22" stroke="#8b7355" stroke-width="1"/>
    <polygon points="92,22 95,20 92,18" fill="#d4c4a8"/>

    <!-- Декоративні камені -->
    <circle cx="30" cy="85" r="1" fill="#8b7355"/>
    <circle cx="90" cy="85" r="1" fill="#8b7355"/>
    <circle cx="60" cy="90" r="1" fill="#8b7355"/>
</svg>
