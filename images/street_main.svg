<svg width="400" height="300"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#f0ead6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e6d7c3;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Фон -->
    <rect width="400" height="300" fill="url(#bg)"/>

    <!-- Дорога -->
    <rect x="0" y="120" width="400" height="60" fill="#d4c4a8"/>

    <!-- Лінії на дорозі -->
    <line x1="0" y1="150" x2="400" y2="150" stroke="#8b7355" stroke-width="2" stroke-dasharray="10,10"/>

    <!-- Будинки -->
    <rect x="50" y="80" width="80" height="40" fill="#c9b896"/>
    <rect x="150" y="70" width="90" height="50" fill="#c9b896"/>
    <rect x="250" y="85" width="75" height="35" fill="#c9b896"/>
    <rect x="320" y="75" width="60" height="45" fill="#c9b896"/>

    <!-- Вікна -->
    <rect x="60" y="90" width="15" height="15" fill="#8b7355"/>
    <rect x="80" y="90" width="15" height="15" fill="#8b7355"/>
    <rect x="160" y="80" width="15" height="15" fill="#8b7355"/>
    <rect x="180" y="80" width="15" height="15" fill="#8b7355"/>
    <rect x="200" y="80" width="15" height="15" fill="#8b7355"/>

    <!-- Текст -->
    <text x="200" y="250" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#8b7355">Вулиця Велика Перспективна</text>
</svg>
