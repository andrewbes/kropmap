<svg width="120" height="120"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="theaterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8b7355;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6b5b47;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="roofGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#d4c4a8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#c9b896;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Основа театру -->
    <rect x="20" y="60" width="80" height="50" fill="url(#theaterGradient)" rx="5"/>

    <!-- Колони -->
    <rect x="25" y="40" width="8" height="70" fill="#f0ead6"/>
    <rect x="40" y="40" width="8" height="70" fill="#f0ead6"/>
    <rect x="55" y="40" width="8" height="70" fill="#f0ead6"/>
    <rect x="70" y="40" width="8" height="70" fill="#f0ead6"/>
    <rect x="85" y="40" width="8" height="70" fill="#f0ead6"/>

    <!-- Капітелі колон -->
    <rect x="24" y="35" width="10" height="8" fill="#8b7355"/>
    <rect x="39" y="35" width="10" height="8" fill="#8b7355"/>
    <rect x="54" y="35" width="10" height="8" fill="#8b7355"/>
    <rect x="69" y="35" width="10" height="8" fill="#8b7355"/>
    <rect x="84" y="35" width="10" height="8" fill="#8b7355"/>

    <!-- Дах -->
    <polygon points="10,35 60,10 110,35" fill="url(#roofGradient)"/>

    <!-- Купол -->
    <ellipse cx="60" cy="25" rx="25" ry="15" fill="#d4c4a8"/>
    <ellipse cx="60" cy="20" rx="20" ry="12" fill="#e6d7c3"/>

    <!-- Шпиль -->
    <rect x="58" y="5" width="4" height="15" fill="#8b7355"/>
    <circle cx="60" cy="3" r="3" fill="#d4c4a8"/>

    <!-- Вікна -->
    <rect x="30" y="70" width="12" height="15" fill="#f5f1e8"/>
    <rect x="50" y="70" width="12" height="15" fill="#f5f1e8"/>
    <rect x="70" y="70" width="12" height="15" fill="#f5f1e8"/>

    <!-- Двері -->
    <rect x="50" y="85" width="20" height="25" fill="#6b5b47"/>
    <circle cx="65" cy="97" r="2" fill="#d4c4a8"/>

    <!-- Декоративні елементи -->
    <circle cx="30" cy="20" r="2" fill="#8b7355"/>
    <circle cx="90" cy="20" r="2" fill="#8b7355"/>
    <circle cx="60" cy="15" r="1" fill="#6b5b47"/>
</svg>
