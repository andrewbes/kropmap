<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мапа Кропивницького - Всі рівні всі різні</title>
    <meta name="description"
        content="Інтерактивна карта Кропивницького з пам'ятками, вулицями">
    <meta name="keywords" content="Кропивницький, карта, місто, пам'ятки, вулиці, інтерактивна карта">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>

<body>
    <!-- Шапка сайту -->
    <header class="header">
        <!-- Декоративний елемент - Театр -->
        <div class="decorative-circle decorative-left">
            <img src="images/theater_round_blur.png" alt="Театр Кропивницького" class="decorative-icon">
        </div>

        <!-- Декоративний елемент - Фортеця -->
        <div class="decorative-circle decorative-right">
            <img src="images/elisabet_fort_transparent.png" alt="Малий герб Кропивницького" class="decorative-icon">
        </div>

        <h1>Мапа Кропивницького</h1>
        <p>Всі рівні - всі різні</p>
    </header>

    <!-- Основний контент -->
    <main class="main-content">
        <div id="map"></div>
        <div class="map-qr">
            <img src="images/qrcode.png" alt="QR код з посиланням на мапу">
        </div>

        <!-- Модальне вікно -->
        <div id="locationModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle"></h2>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div id="modalContent"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Футер -->
    <footer class="footer">
        <p>
            © 2026 Мапа Кропивницького
        </p>
    </footer>

    <!-- Підключення скриптів -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>
</body>

</html>
